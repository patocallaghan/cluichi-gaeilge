<style>
  :root{
    --g:#169B62; --g-soft:#DDF3E8; --o:#FF883E; --o-soft:#FFEBDD;
    --red:#E2433B; --red-soft:#FFE3E0; --yel:#F2C230; --yel-soft:#FFF5D1; --blu:#2C7BE5; --blu-soft:#DFECFF;
    --sun:#F5A623; --sun-soft:#FFF0DC; --ok:#2EAA62; --ok-soft:#DDF5E6; --vio:#8A5CE0;
    --ink:#2B2B3A; --mute:#7A7A8C; --paper:#FFFBF2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
  #confetti{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}
  /* hub */
  .hub-head{text-align:center;padding:22px 0 26px}
  .hub-head .flag{font-size:46px;line-height:1}
  .hub-head h1{font-size:clamp(30px,7vw,46px);font-weight:700;margin-top:6px;letter-spacing:-.5px}
  .hub-head h1 .g{color:var(--g)} .hub-head h1 .w{color:#B9B9C6} .hub-head h1 .o{color:var(--o)}
  .hub-head p{color:var(--mute);font-size:17px;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{border-radius:22px;padding:20px 18px;color:#fff;background:var(--bg);box-shadow:0 6px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:6px;transition:transform .15s;min-height:190px}
  .card:hover{transform:translateY(-3px) rotate(-.5deg)} .card:active{transform:translateY(2px)}
  .card .ce{font-size:42px} .card h2{font-size:25px;font-weight:700}
  .card p{font-size:15px;opacity:.95;line-height:1.35;flex:1}
  .card .cp{background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:600;align-self:flex-start;font-size:15px}
  .card .step{position:absolute}
  .mute{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);font-size:20px;z-index:20}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .back{background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}
  .top .t{flex:1;font-size:22px;font-weight:700;text-align:center}
  .chip{background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}
  /* level map */
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  .lvl{background:#fff;border-radius:20px;padding:14px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.08);border:3px solid transparent;transition:transform .12s;position:relative}
  .lvl:not(.locked):hover{transform:translateY(-3px);border-color:var(--sun)}
  .lvl .n{position:absolute;top:8px;left:10px;font-weight:700;color:var(--mute);font-size:14px}
  .lvl .e{font-size:36px} .lvl .nm{font-weight:700;font-size:17px;margin-top:2px}
  .lvl .sb{color:var(--mute);font-size:13px;margin-top:2px;min-height:17px}
  .lvl .st{font-size:22px;letter-spacing:2px;margin-top:4px;color:#E2DFD6} .lvl .st .on{color:var(--sun)}
  .lvl.locked{opacity:.5;cursor:not-allowed} .lvl.locked .e{filter:grayscale(1)}
  .lvl.boss{background:linear-gradient(135deg,#FFF0DC,#DDF3E8)}
  .hint{text-align:center;color:var(--mute);margin-top:18px;font-size:14px}
  /* intro */
  .intro{text-align:center}
  .big{font-size:60px;line-height:1.1}
  .intro h2{font-size:28px;margin:6px 0 2px}
  .intro .lead{color:var(--mute);font-size:17px;margin-bottom:14px}
  .tip{background:var(--sun-soft);border:3px dashed var(--sun);border-radius:16px;padding:12px 14px;max-width:620px;margin:0 auto 18px;font-size:16px;line-height:1.45;text-align:left}
  .big-btn{background:var(--ok);color:#fff;font-size:22px;font-weight:700;padding:14px 34px;border-radius:999px;box-shadow:0 5px 0 #1E8A4C}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1E8A4C}
  .big-btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #D6D3C8}
  .big-btn.red{background:#E04B3A;box-shadow:0 5px 0 #B23526}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  /* tables */
  .tw{overflow-x:auto;margin:0 auto 16px;max-width:100%;-webkit-overflow-scrolling:touch}
  table.tb{border-collapse:separate;border-spacing:0;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.06);font-size:17px}
  .tb th,.tb td{padding:7px 11px;border-bottom:1px solid #F0ECE2;text-align:left;white-space:nowrap}
  .tb tr:last-child td{border-bottom:none}
  .tb th{background:var(--ink);color:#fff;font-weight:600}
  .tb td.p{color:var(--mute);font-weight:600}
  .tb td.f{font-weight:600}
  .tb .r{background:var(--red-soft)} .tb .y{background:var(--yel-soft)} .tb .b{background:var(--blu-soft)}
  .tb th.r{background:var(--red)} .tb th.y{background:var(--yel);color:var(--ink)} .tb th.b{background:var(--blu)}
  .tb small{color:var(--mute);font-weight:400}
  /* play */
  .prog{flex:1;height:14px;background:#EEEAE0;border-radius:999px;overflow:hidden}
  .prog div{height:100%;background:linear-gradient(90deg,var(--g),var(--o));border-radius:999px;transition:width .3s}
  .qc{text-align:center;color:var(--mute);font-weight:500;margin-bottom:10px;font-size:16px}
  .wcard{background:#fff;border-radius:26px;padding:28px 16px 24px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);border:4px solid transparent;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
  .wcard .w{font-size:clamp(34px,9vw,54px);font-weight:700;letter-spacing:-.3px;word-break:break-word;line-height:1.15}
  .wcard .w.sm{font-size:clamp(24px,6vw,34px)}
  .wcard .en{color:var(--mute);font-size:17px;margin-top:6px}
  .wcard.good{border-color:var(--ok);background:var(--ok-soft)}
  .wcard.bad{border-color:#E04B3A;background:#FFE8E4}
  .shake{animation:shake .4s} .pop{animation:pop .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @keyframes pop{50%{transform:scale(1.06)}}
  .timer{position:absolute;left:0;bottom:0;height:7px;background:var(--o);width:100%}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .ob{background:#fff;border:3px solid #E6E1D4;border-radius:20px;padding:16px 8px;font-size:clamp(17px,4.6vw,23px);font-weight:600;box-shadow:0 5px 0 #E6E1D4;transition:transform .1s,opacity .2s;min-height:66px;line-height:1.2}
  .ob:active{transform:translateY(3px)}
  .ob.good{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 #1E8A4C}
  .ob.bad{background:#E04B3A;border-color:#E04B3A;color:#fff;box-shadow:0 5px 0 #B23526}
  .ob.dim{opacity:.4}
  .keys{text-align:center;color:#B9B9C6;font-size:13px;margin-top:10px}
  .fb{margin-top:16px;border-radius:20px;padding:14px 16px;animation:slide .25s ease-out}
  @keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fb.good{background:var(--ok-soft);border:3px solid var(--ok)}
  .fb.bad{background:#FFE8E4;border:3px solid #E04B3A}
  .fb .ft{font-weight:700;font-size:20px}
  .fb .fp{font-size:24px;font-weight:600;margin:4px 0}
  .fb .fn{font-size:16px;line-height:1.45}
  .next{display:block;margin:14px auto 0}
  /* tense pills */
  .tp{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px;border:2px solid transparent}
  .tp.r{background:var(--red);color:#fff} .tp.y{background:var(--yel);color:var(--ink)} .tp.b{background:var(--blu);color:#fff}
  .tp.w{background:#fff;border-color:var(--ink)} .tp.k{background:var(--ink);color:#fff}
  /* build */
  .slots{display:grid;gap:8px;max-width:420px;margin:16px auto 0}
  .slot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.06);border:3px solid transparent}
  .slot .lb{min-width:96px;color:var(--mute);font-weight:600;font-size:15px}
  .slot .fv{font-size:22px;font-weight:700;flex:1;min-height:28px}
  .slot.cur{border-color:var(--o)} .slot.done{background:var(--ok-soft)}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .tile{background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;font-size:21px;font-weight:700;box-shadow:0 5px 0 #0E7347}
  .tile.used{visibility:hidden} .tile.hintme{background:var(--o);box-shadow:0 5px 0 #C9621F;animation:pop .6s infinite}
  .tile.no{background:#E04B3A;box-shadow:0 5px 0 #B23526}
  /* match */
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:16px}
  .mcol{display:grid;gap:10px;align-content:start}
  .mt{background:#fff;border:3px solid #E6E1D4;border-radius:16px;padding:12px 8px;font-size:clamp(15px,4.2vw,20px);font-weight:600;box-shadow:0 4px 0 #E6E1D4;min-height:54px;line-height:1.2}
  .mt.sel{border-color:var(--o);background:var(--o-soft)}
  .mt.ok{background:var(--ok-soft);border-color:var(--ok);color:#1E8A4C;box-shadow:none;opacity:.6}
  .mt.no{background:#FFE8E4;border-color:#E04B3A}
  /* results */
  .res{text-align:center}
  .res h2{font-size:34px;margin-top:4px}
  .res .score{font-size:20px;color:var(--mute)}
  .stars{font-size:52px;letter-spacing:6px;color:#E2DFD6;margin:6px 0}
  .stars .on{color:var(--sun);display:inline-block;animation:pop .5s}
  .res .msg{font-size:18px;margin-bottom:14px}
  .review{background:#fff;border-radius:20px;padding:14px 16px;text-align:left;max-width:520px;margin:0 auto 18px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
  .review h3{font-size:18px;margin-bottom:6px}
  .review li{list-style:none;padding:6px 0;border-top:1px solid #F0ECE2;font-size:18px}
  .review li:first-of-type{border-top:none}
  .review li small{display:block;color:var(--mute);font-size:14px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:2px dashed #E6E1D4;color:var(--mute);font-size:14px}
  .link{background:none;color:#C0392B;font-weight:600;font-size:14px;text-decoration:underline;padding:4px 0}
  .modal{position:fixed;inset:0;background:rgba(43,43,58,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:slide .2s}
  .mbox{background:#fff;border-radius:24px;padding:22px 20px;max-width:380px;text-align:center}
  .mbox h3{font-size:22px;margin:4px 0} .mbox p{color:var(--mute);margin-bottom:16px;line-height:1.4}
  .mbox .big-btn{font-size:18px;padding:11px 22px}
  /* card page */
  .sec{margin:22px 0 8px;font-size:22px;font-weight:700;text-align:center}
  .sec small{display:block;font-size:15px;color:var(--mute);font-weight:500}
  .mbar{height:10px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-top:4px}
  .mbar div{height:100%;background:#fff}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<canvas id="confetti"></canvas>
<button class="mute" id="mute" aria-label="Sound on/off"></button>

<script>
/* ================= helpers ================= */
const app = document.getElementById('app');

/* ================= progress (account-synced, device fallback) ================= */
const Progress = (() => {
  const LKEY = 'ig.progress';
  let data = store.get(LKEY, null) || {games:{}, updatedAt:0};
  let ref = null, queue = Promise.resolve(), listeners = [], status = 'device';
  const clone = o => JSON.parse(JSON.stringify(o));
  const notify = () => listeners.forEach(f => f());
  function persist(){
    store.set(LKEY, data);
    if(!ref) return;
    const body = clone(data);
    queue = queue.then(() => ref.set(body)).catch(() => {});
  }
  async function connect(){
    try{
      if(!window.claude || !claude.use) return;
      status = 'loading';
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const id = db && user ? await user.id() : null;
      if(!id){ status = 'device'; notify(); return; }
      const r = db.doc('data/users/' + id + '/progress');
      const snap = await Promise.race([r.get(), new Promise((_, no) => setTimeout(() => no('timeout'), 10000))]);
      const cloud = snap.exists ? snap.data() : null;
      ref = r; status = 'cloud';
      if(cloud && (cloud.updatedAt || 0) >= (data.updatedAt || 0)){
        data = clone(cloud); if(!data.games) data.games = {};
        store.set(LKEY, data);
      } else persist();
      notify();
    }catch(e){ ref = null; status = 'device'; notify(); }
  }
  return {
    get: (game, def) => clone(data.games[game] || def),
    set(game, val){ data.games[game] = clone(val); data.updatedAt = Date.now(); persist(); },
    resetGame(game){ delete data.games[game]; data.updatedAt = Date.now(); persist(); notify(); },
    resetAll(){ data.games = {}; data.updatedAt = Date.now(); persist(); notify(); },
    status: () => status, onChange: f => listeners.push(f), connect,
  };
})();

/* mastery: every fact has a box 0–5. Right → up one, wrong → back to 0. Box 3+ = "learnt". */
let M = {};
function markFact(key, ok){
  if(!key) return;
  const e = M[key] || {b:0, t:0};
  e.b = ok ? Math.min(5, e.b + 1) : 0; e.t = Date.now();
  M[key] = e;
}

let muted = store.get('ig.muted', false), actx = null;
function tone(freqs, step=0.11, type='sine', vol=0.14){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const s = t0 + i*step;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(vol, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + step + 0.08);
      o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + step + 0.1);
    });
  }catch(e){}
}

function confetti(){
  const c = document.getElementById('confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const cols = ['#169B62','#FF883E','#F2C230','#2C7BE5','#E2433B'];
  const ps = Array.from({length:150}, () => ({ x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.6,
    vx: (Math.random()-.5)*3, vy: 2 + Math.random()*3, r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
    s: 7 + Math.random()*7, c: cols[Math.random()*cols.length|0] }));
  let t = 0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(++t < 240) requestAnimationFrame(f); else { x.clearRect(0,0,c.width,c.height); c.style.display='none'; }
  })();
}

/* mutations */
const VOW = /^[aeiouáéíóú]/i;
const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
function len(w){ // séimhiú (add h)
  if(VOW.test(w)) return w;
  const c = w[0].toLowerCase();
  if('bcdfgmpt'.includes(c) && w[1] !== 'h') return w[0] + 'h' + w.slice(1);
  if(c === 's' && /[aeiouáéíóúlnr]/i.test(w[1])) return w[0] + 'h' + w.slice(1);
  return w;
}
function ecl(w){ // urú
  if(VOW.test(w)) return 'n-' + w;
  const m = {b:'m',c:'g',d:'n',f:'bh',g:'n',p:'b',t:'d'}[w[0].toLowerCase()];
  return m ? m + w : w;
}
VERBS.forEach(v => {
  const c = lc(v.cmd), pr = lc(v.pres), fu = lc(v.fut);
  v.negCmd  = 'Ná ' + (VOW.test(c) ? 'h' + c : c);
  v.negPast = 'Níor ' + len(c);  v.qPast = 'Ar ' + len(c) + '?';
  const eq = w => VOW.test(w) ? w : ecl(w); // "An" eclipses consonants only: An éiríonn?
  v.negPres = 'Ní ' + len(pr);   v.qPres = 'An ' + eq(pr) + '?';
  v.negFut  = 'Ní ' + len(fu);   v.qFut  = 'An ' + eq(fu) + '?';
  v.fakes = {
    negCmd:  ['Ná ' + len(c), 'Ná ' + c, 'Ní ' + len(c), 'Níor ' + len(c), 'Ná ' + ecl(c)],
    negPast: ['Níor ' + c, 'Níor ' + lc(v.past), 'Ní ' + lc(v.past), 'Níor ' + ecl(c), 'Ní ' + len(c)],
    qPast:   ['An ' + eq(c) + '?', 'Ar ' + c + '?', 'An ' + lc(v.past) + '?', 'Ar ' + lc(v.past) + '?', 'Níor ' + len(c) + '?'],
    negPres: ['Ní ' + pr, 'Ní ' + ecl(pr), 'Níor ' + len(pr), 'Níl ' + pr],
    qPres:   ['An ' + pr + '?', 'An ' + len(pr) + '?', 'Ar ' + len(pr) + '?', 'Ar ' + pr + '?', 'An h' + pr + '?', 'Ní ' + len(pr) + '?'],

  negCmd: {t:'cmd', from:'cmd', word:'Ná',     en:v=>`Don’t ${v.base}!`,  rule:'<b>Ná</b> + the command. Before a vowel add <b>h</b>: Ná <b>h</b>éirigh!'},
  negPast:{t:'past',from:'past',word:'Níor',   en:v=>`didn’t ${v.base}`,  rule:'<b>Níor</b> + séimhiú (add <b>h</b>). The <b>D’</b> disappears: Níor éirigh, Níor fhoghlaim.'},
  qPast:  {t:'past',from:'past',word:'Ar…?',   en:v=>`did … ${v.base}?`,  rule:'<b>Ar</b> + séimhiú (add <b>h</b>), and no <b>D’</b>: Ar cheannaigh? Ar éirigh?'},
  negPres:{t:'pres',from:'pres',word:'Ní',     en:v=>`doesn’t ${v.base}`, rule:'<b>Ní</b> + séimhiú (add <b>h</b>). Vowels don’t change: Ní éiríonn.'},
  qPres:  {t:'pres',from:'pres',word:'An…?',   en:v=>`does … ${v.base}?`, rule:'<b>An</b> + urú (a letter in front): c→<b>g</b>c, t→<b>d</b>t, d→<b>n</b>d, f→<b>bh</b>f. Vowels don’t change: An éiríonn?'},
  negFut: {t:'fut', from:'fut', word:'Ní',     en:v=>`won’t ${v.base}`,   rule:'<b>Ní</b> + séimhiú (add <b>h</b>). Vowels don’t change.'},
  qFut:   {t:'fut', from:'fut', word:'An…?',   en:v=>`will … ${v.base}?`, rule:'<b>An</b> + urú (a letter in front): An <b>g</b>ceannóidh? Vowels don’t change: An éireoidh?'},
};

const QW = [
  ['Cé?','Who?','Cé thusa? = Who are you?'],
  ['Cad? / Céard?','What?','Cad is ainm duit? = What’s your name?'],
  ['Cá? / Cár?','Where?','Cá bhfuil tú i do chónaí? = Where do you live?'],
  ['Conas? / Cén chaoi?','How?','Conas atá tú? = How are you?'],
  ['Cathain? / Cén uair?','When?','Cathain a thosaíonn an scoil? = When does school start?'],
  ['Cén fáth?','Why?','Cén fáth a bhfuil tú déanach? = Why are you late?'],
  ['Cé mhéad?','How much? / How many?','Cé mhéad atá air? = How much is it?'],
  ['Cé acu?','Which?','Cé acu is fearr leat? = Which do you prefer?'],
  ['Cén t-am é?','What time is it?','Tá sé a trí a chlog. = It’s three o’clock.'],
  ['Cad a tharla?','What happened?','Cad a tharla duit? = What happened to you?'],
  ['Cé hé / hí sin?','Who’s that?','Cé hí sin? = Who’s that (girl)?'],
  ['Cá bhfios duit?','How do you know?','Cá bhfios duit go bhfuil sé tinn? = How do you know he’s sick?'],

  ['Fíor nó bréagach?','True or false?','Tá an féar gorm. Fíor nó bréagach? = The grass is blue. True or false?'],

const BI = [
  {ga:'Inné',   c:'r', q:'An raibh…?',  y:'Bhí',   n:'Ní raibh',  wh:'Cá raibh…?',  whEn:'Where was / were…?',  ex:'An raibh tú ar scoil inné?',            exEn:'Were you at school yesterday?'},
  {ga:'Anois',  c:'y', q:'An bhfuil…?', y:'Tá',    n:'Níl',       wh:'Cá bhfuil…?', whEn:'Where is / are…?',    ex:'An bhfuil tú tuirseach?',                exEn:'Are you tired?'},
  {ga:'Gach lá',c:'y', q:'An mbíonn…?', y:'Bíonn', n:'Ní bhíonn', wh:'Cá mbíonn…?', whEn:'Where is… usually?',  ex:'An mbíonn tú ag snámh gach lá?',         exEn:'Do you go swimming every day?'},
  {ga:'Amárach',c:'b', q:'An mbeidh…?', y:'Beidh', n:'Ní bheidh', wh:'Cá mbeidh…?', whEn:'Where will… be?',     ex:'An mbeidh tú ag an gcluiche amárach?',   exEn:'Will you be at the match tomorrow?'},
];
const LIKE = [
  {q:'An maith leat…?',   en:'Do you like…?',     y:'Is maith liom',  n:'Ní maith liom',   ex:'An maith leat seacláid?', exEn:'Do you like chocolate?'},
  {q:'Ar mhaith leat…?',  en:'Would you like…?',  y:'Ba mhaith liom', n:'Níor mhaith liom',ex:'Ar mhaith leat cupán tae?', exEn:'Would you like a cup of tea?'},
  {q:'An féidir leat…?',  en:'Can you…?',         y:'Is féidir liom', n:'Ní féidir liom',  ex:'An féidir leat snámh?', exEn:'Can you swim?'},
];

/* =====================================================================
   QUESTION MAKERS — each fact has a key (for the review game)
   ===================================================================== */
// options: correct + nearby distractors first, then others
function mkOpts(ans, near, far=[], n=4){
  const out = [ans], seen = new Set([ans.toLowerCase()]);
  for(const pool of [shuffle(near), shuffle(far)]) for(const o of pool){
    if(out.length >= n) break;
    if(!seen.has(o.toLowerCase())){ seen.add(o.toLowerCase()); out.push(o); }
  }
  return shuffle(out);
}
const mc = o => ({t:'mc', ...o, options: mkOpts(o.ans, o.near || [], o.far || [])});
// while a level builds its questions, SCOPE limits wrong options to what has been taught so far
let SCOPE = null;
const inPreps = () => SCOPE && SCOPE.preps ? PREPS.filter(q => SCOPE.preps.includes(q.ga)) : PREPS;
const inVerbs = () => SCOPE && SCOPE.verbs ? VERBS.filter(v => SCOPE.verbs.includes(v.id)) : VERBS;
const inForms = () => SCOPE && SCOPE.forms ? SCOPE.forms : null;
const inQW = () => SCOPE && SCOPE.qw ? SCOPE.qw : null;
const IN_EN = 'Cad é sin i mBéarla? · In English?';
const IN_GA = 'Cuir Gaeilge air · In Irish?';

/* pronouns */
function prQ(i, dir = rnd(2)){
  const [ga, en] = PRON[i], key = 'pr:' + i;
  if(dir === 0) return mc({key, tag:IN_EN, prompt:ga, ans:en, near:PRON.map(p=>p[1]), note:`<b>${ga}</b> = ${en}`});
  return mc({key, tag:IN_GA, prompt:en, ans:ga, near:PRON.map(p=>p[0]), note:`${en} = <b>${ga}</b>`});
}
function poQ(i, dir = rnd(3)){
  const [ga, en] = POSS[i], key = 'po:' + i, note = `<b>${ga}</b> = ${en} · e.g. <b>${COTA[i]}</b>`;
  if(dir === 0){ const e = ga === 'a' ? 'his / her / their' : en;
    return mc({key, tag:IN_EN, prompt:ga, sub:'(my, your, his…)', ans:e, near:POSS.filter(p=>p[0]!==ga).map(p=>p[1]), note:ga === 'a' ? `<b>a</b> = his, her or their · <b>a chóta</b> (his coat), <b>a cóta</b> (her coat), <b>a gcóta</b> (their coat)` : note}); }
  if(dir === 1) return mc({key, tag:IN_GA, prompt:en, ans:ga, near:POSS.map(p=>p[0]), note});
  return mc({key, tag:'Cén focal? · Which “my, your…” word goes with this person?', prompt:PERS[i], ans:ga, near:POSS.map(p=>p[0]), note:`${PERS[i]} → <b>${ga}</b> (${en})`});
}

/* prepositional pronouns */
const ppLabel = (p, i) => `${p.ga} + ${PERS[i]}`;
const HAVE = ['I have','you have','he has','she has','we have','you have','they have'];
const ppEn = (p, i) => p.ga === 'idir' ? `between ${OBJ[i]}${i < 4 ? ' and …' : ''}` : p.ga === 'ag' ? `at ${OBJ[i]} — ${HAVE[i]}` : `${p.en} ${OBJ[i]}`;
const ppNote = (p, i) => `<b>${p.ga}</b> + <b>${PERS[i]}</b> = <b>${p.f[i]}</b> · “${ppEn(p, i)}”`;
function ppNear(p, i){ return [...p.f.filter((_, j) => j !== i), ...inPreps().filter(q => q !== p).map(q => q.f[i])]; }
function ppQ(p, i, dir = rnd(3)){
  const key = `pp:${p.ga}:${i}`, note = ppNote(p, i);
  if(dir === 1 && FORMCOUNT[p.f[i]] === 1){
    const near = [...p.f.map((_, j) => ppLabel(p, j)), ...inPreps().map(q => ppLabel(q, i))].filter(x => x !== ppLabel(p, i));
    return mc({key, tag:'Bris ina dhá chuid é · Split it in two', prompt:p.f[i], ans:ppLabel(p, i), near, note});
  }
  if(dir === 2){ const clash = CONFUSE[p.ga] || [];
    const near = shuffle(p.f).slice(0,3).concat(inPreps().filter(q => !clash.includes(q.ga)).map(q=>q.f[i]))
      .filter(f => f === p.f[i] || FORMCOUNT[f] === 1); // "di" is two different words — never a wrong option here
    return mc({key, tag:IN_GA, prompt:ppEn(p, i), ans:p.f[i], near, far:p.f.filter(f => FORMCOUNT[f] === 1), note}); }
  return mc({key, tag:'Cuir le chéile · Put them together', prompt:ppLabel(p, i), sub:ppEn(p, i), ans:p.f[i], near:take(ppNear(p, i).slice(0,6), 2).concat(take(ppNear(p,i).slice(6), 3)), far:p.f, note});
}
function ppNext(p, i = 2 + rnd(5)){
  const shown = p.f.slice(0, i).join(' · ');
  return mc({key:`pp:${p.ga}:${i}`, tag:'Cad a thagann ina dhiaidh? · What comes next?', prompt:`${shown} · <span style="color:var(--o)">?</span>`, small:true,
    ans:p.f[i], near:p.f.filter((_, j) => j !== i), note:`${p.f.slice(0, i + 1).join(' · ')} …`});
}
function ppBuild(p){
  return {t:'build', keys:p.f.map((_, i) => `pp:${p.ga}:${i}`), tag:'Tóg an colún · Build the column',
    prompt:`<b>${p.ga}</b> <span style="font-weight:500;color:var(--mute)">(${p.en})</span>`, slots:PERS, tiles:p.f, note:p.f.join(' · ')};
}
function ppMatch(pairs){ // pairs: [[p,i]]
  return {t:'match', tag:'Meaitseáil · Match them up', pairs:pairs.map(([p, i]) => [ppLabel(p, i), p.f[i], `pp:${p.ga}:${i}`])};
}
function sentQ(s){
  const [ga, en, pg, i] = s, p = P(pg);
  return mc({key:`pp:${pg}:${i}`, tag:'Líon an bhearna · Fill the gap', prompt:ga.replace('___','<span style="color:var(--o)">___</span>'), small:true, sub:en,
    ans:p.f[i], near:p.f.filter((_, j) => j !== i),
    note:`${ga.replace('___', '<b>' + p.f[i] + '</b>')} · (${p.ga} + ${PERS[i]})`});
}

/* verbs */
function vbMean(v, dir = rnd(2)){
  const key = `vb:${v.id}:cmd`, note = `<b>${v.cmd}</b> = ${v.label}`;
  if(dir === 0) return mc({key, tag:IN_EN, prompt:v.cmd, ans:v.label, near:inVerbs().map(x => x.label), note});
  return mc({key, tag:IN_GA, prompt:v.label, ans:v.cmd, near:inVerbs().map(x => x.cmd), note});
}
const FORMS = ['cmd','past','pres','fut','vn','va'];
function pastFakes(v){ const c = lc(v.cmd); return [v.cmd, "D'" + c, "D'" + len(c), len(v.cmd), VOW.test(c) ? 'H' + c : 'D' + c]; }
function vbForm(v, t){
  const allowed = inForms() || FORMS;
  const others = FORMS.filter(f => f !== t && allowed.includes(f)).map(f => v[f]).filter(x => x.toLowerCase() !== v[t].toLowerCase());
  const near = (t === 'past' && (others.length < 2 || Math.random() < .5)) ? pastFakes(v) : others;
  return mc({key:`vb:${v.id}:${t}`, tag:`${pill(t)} &nbsp;${TN[t].en}`, prompt:v.cmd, sub:v.label, ans:v[t], near, far:VERBS.map(x => x[t]),
    note:`${v.cmd} → <b>${v[t]}</b> (${enOf(v, t)})${v.id === 'I' && t === 'vn' ? ' — yes, it’s the same word as the command!' : ''}`});
}
function vbWhich(v, t){
  return mc({key:`vb:${v.id}:${t}`, tag:'Cén cineál? · Which form is it?', prompt:v[t], sub:v.label, ans:TN[t].ga,
    near:['cmd','past','pres','fut'].concat(t === 'vn' || t === 'va' ? ['vn','va'] : []).filter(f => f !== t).map(f => TN[f].ga),
    note:`<b>${v[t]}</b> is ${pill(t)} (${enOf(v, t)})`});
}
function vbSeq(v){
  return {t:'build', keys:['past','pres','fut'].map(t => `vb:${v.id}:${t}`), tag:'Cuir in ord · Put each form in its place',
    prompt:v.label, slots:['Ordú','Inné','Gach lá','Amárach'], tiles:[v.cmd, v.past, v.pres, v.fut], note:[v.cmd, v.past, v.pres, v.fut].join(' · ')};
}
function vbPerson(v, f){
  const d = PFORM[f];
  return mc({key:`vb:${v.id}:${f}`, tag:`${pill(d.t)} &nbsp;+ <b>${d.who}</b> · Cuir Gaeilge air`, prompt:v.cmd, sub:v.label,
    ans:v[f], near:Object.keys(PFORM).filter(k => k !== f).map(k => v[k]),
    note:`<b>${v[f]}</b> = ${d.en(v)} · ending <b>${d.end}</b>${d.who === 'mé' ? '' : ` <span style="color:var(--mute)">(you’ll also hear <b>${v[d.t]} muid</b>)</span>`}`});
}
function vbNeg(v, f){
  const d = NEG[f];
  return mc({key:`vb:${v.id}:${f}`, tag:`${pill(d.t)} &nbsp;+ <b>${d.word}</b> &nbsp;(${d.en(v)})`, prompt:v[d.from], sub:v.label,
    ans:v[f], near:v.fakes[f], far:VERBS.map(x => x[f]), note:`<b>${v[f]}</b><br>${d.rule}`});
}
const SUBJ = [['sé','He','he',1],['sí','She','she',1],['siad','They','they',0],['tú','You (one person)','you (one person)',0]];
function vbSent(v){
  const t = pick(['past','pres','fut']), pol = pick(['pos','pos','neg','q']), syn = Math.random() < .3;
  let en, ga, key, alts = [];
  const ob = OBJ_OF[v.id], oE = ob ? ' ' + ob[0] : '', oG = ob ? ' ' + ob[1] : '';
  if(syn){
    const f = pol === 'pos' ? pick(Object.keys(PFORM)) : pick(Object.keys(PFORM));
    const s = PFORM[f].en(v); en = s.charAt(0).toUpperCase() + s.slice(1) + oE + '.'; ga = v[f] + oG + '.'; key = `vb:${v.id}:${f}`;
    alts = Object.keys(PFORM).filter(k => k !== f).map(k => v[k] + oG + '.');
  } else {
    const [pr, S, s, third] = pick(SUBJ);
    const EN = {
      past:{pos:`${S} ${v.pastEn}${oE}.`, neg:`${S} didn’t ${v.base}${oE}.`, q:`Did ${s} ${v.base}${oE}?`},
      pres:{pos:`${S} ${third ? v.s : v.base}${oE}.`, neg:`${S} ${third ? 'doesn’t' : 'don’t'} ${v.base}${oE}.`, q:`${third ? 'Does' : 'Do'} ${s} ${v.base}${oE}?`},
      fut: {pos:`${S} will ${v.base}${oE}.`, neg:`${S} won’t ${v.base}${oE}.`, q:`Will ${s} ${v.base}${oE}?`},
    };
    const GA = tt => ({
      pos:`${v[tt]} ${pr}${oG}.`,
      neg:`${v['neg' + cap3(tt)]} ${pr}${oG}.`,
      q:`${v['q' + cap3(tt)].slice(0, -1)} ${pr}${oG}?`,
    });
    en = EN[t][pol]; ga = GA(t)[pol];
    key = `vb:${v.id}:${pol === 'pos' ? t : (pol === 'neg' ? 'neg' : 'q') + cap3(t)}`;
    ['past','pres','fut'].forEach(tt => ['pos','neg','q'].forEach(pp => alts.push(GA(tt)[pp])));
    alts = alts.filter(a => a !== ga);
  }
  const near = alts.filter(a => a.split(' ')[0] === ga.split(' ')[0] || a.split(' ').slice(-1)[0] === ga.split(' ').slice(-1)[0]);
  return mc({key, tag:IN_GA, prompt:en, small:true, ans:ga, near, far:alts, note:`<b>${ga}</b>`});
}
function cap3(t){ return {past:'Past', pres:'Pres', fut:'Fut'}[t]; }

/* question words, bí, likes */
function qwQ(i, dir = rnd(2)){
  const [ga, en, ex] = QW[i], key = 'qw:' + i, note = `<b>${ga}</b> = ${en}<br><span style="color:var(--mute)">${ex}</span>`;
  const ok = j => !((i === 0 && j === 10) || (i === 10 && j === 0)); // Cé? vs Cé hé sin? too close
  const pool = j => ok(j) && (!inQW() || inQW().includes(j));
  if(dir === 0) return mc({key, tag:IN_EN, prompt:ga, ans:en, near:QW.filter((_, j) => pool(j)).map(q => q[1]), note});
  return mc({key, tag:IN_GA, prompt:en, ans:ga, near:QW.filter((_, j) => pool(j)).map(q => q[0]), note});
}
const biPill = b => `<span class="tp ${b.c}">${b.ga}</span>`;
function biAns(i, yes = Math.random() < .5){
  const b = BI[i], ans = yes ? b.y : b.n;
  return mc({key:`bi:${i}:${yes ? 'y' : 'n'}`, tag:yes ? '👍 Abair “yes” · Answer yes' : '👎 Abair “no” · Answer no', prompt:b.ex, small:true, sub:b.exEn,
    ans, near:BI.map(x => yes ? x.y : x.n).concat([yes ? b.n : b.y]), note:`${b.q} → <b>${b.y}</b> / <b>${b.n}</b> ${biPill(b)}`});
}
function biTense(i){
  const b = BI[i];
  return mc({key:`bi:${i}:q`, tag:'Cathain? · When is it about?', prompt:b.q, ans:b.ga, near:BI.map(x => x.ga), note:`<b>${b.q}</b> ${biPill(b)} → ${b.y} / ${b.n}`});
}
function biWh(i){
  const b = BI[i];
  return mc({key:`bi:${i}:wh`, tag:IN_GA, prompt:b.whEn, small:true, ans:b.wh, near:BI.map(x => x.wh), note:`<b>${b.wh}</b> ${biPill(b)}`});
}
function lkAns(i, yes = Math.random() < .5){
  const l = LIKE[i], ans = yes ? l.y : l.n;
  return mc({key:`lk:${i}:${yes ? 'y' : 'n'}`, tag:yes ? '👍 Abair “yes” · Answer yes' : '👎 Abair “no” · Answer no', prompt:l.ex, small:true, sub:l.exEn,
    ans, near:LIKE.map(x => yes ? x.y : x.n).concat([yes ? l.n : l.y]), note:`${l.q} → <b>${l.y}</b> / <b>${l.n}</b>`});
}
function lkMean(i, dir = rnd(2)){
  const l = LIKE[i], key = `lk:${i}:q`, note = `<b>${l.q}</b> = ${l.en}`;
  if(dir === 0) return mc({key, tag:IN_EN, prompt:l.q, ans:l.en, near:LIKE.map(x => x.en).concat(['Do you think…?']), note});
  return mc({key, tag:IN_GA, prompt:l.en, ans:l.q, near:LIKE.map(x => x.q).concat(['An dóigh leat…?']), note});
}
const matchQ = (pairs, tag = 'Meaitseáil · Match them up') => ({t:'match', tag, pairs});

/* ---- every fact, for the review game ---- */
const FACTS = {};
PRON.forEach((_, i) => FACTS['pr:' + i] = () => prQ(i));
POSS.forEach((_, i) => FACTS['po:' + i] = () => poQ(i));
PREPS.forEach(p => p.f.forEach((_, i) => FACTS[`pp:${p.ga}:${i}`] = () => {
  const s = SENTS.filter(x => x[2] === p.ga && x[3] === i);
  return s.length && Math.random() < .4 ? sentQ(pick(s)) : ppQ(p, i);
}));
VERBS.forEach(v => {
  FACTS[`vb:${v.id}:cmd`] = () => vbMean(v);
  ['past','pres','fut','vn','va'].forEach(t => FACTS[`vb:${v.id}:${t}`] = () => vbForm(v, t));
  Object.keys(PFORM).forEach(f => FACTS[`vb:${v.id}:${f}`] = () => vbPerson(v, f));
  Object.keys(NEG).forEach(f => FACTS[`vb:${v.id}:${f}`] = () => vbNeg(v, f));
});
QW.forEach((_, i) => FACTS['qw:' + i] = () => qwQ(i));
BI.forEach((_, i) => { FACTS[`bi:${i}:y`] = () => biAns(i, true); FACTS[`bi:${i}:n`] = () => biAns(i, false); FACTS[`bi:${i}:q`] = () => biTense(i); FACTS[`bi:${i}:wh`] = () => biWh(i); });
LIKE.forEach((_, i) => { FACTS[`lk:${i}:y`] = () => lkAns(i, true); FACTS[`lk:${i}:n`] = () => lkAns(i, false); FACTS[`lk:${i}:q`] = () => lkMean(i); });
const FACT_TOTAL = Object.keys(FACTS).length;

/* =====================================================================
   LEARN TABLES (shown before each level)
   ===================================================================== */
const tw = h => `<div class="tw">${h}</div>`;
function prepTable(gas){
  const ps = gas.map(P);
  return tw(`<table class="tb"><tr><th></th>${ps.map(p => `<th>${p.ga}<br><small style="color:#ddd">${p.en}</small></th>`).join('')}</tr>
    ${PERS.map((pe, i) => `<tr><td class="p">${pe}</td>${ps.map(p => `<td class="f">${p.f[i]}</td>`).join('')}</tr>`).join('')}</table>`);
}
function rowsTable(head, rows){
  return tw(`<table class="tb">${head ? `<tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>` : ''}${rows.map(r => `<tr>${r.map((c, j) => `<td class="${j ? 'f' : 'p'}">${c}</td>`).join('')}</tr>`).join('')}</table>`);
}
function verbTable(vs, cols){
  const cls = {cmd:'', past:'r', pres:'y', fut:'b', vn:'', va:'', presMe:'y', pastWe:'r', presWe:'y', futWe:'b'};
  const head = {cmd:'Ordú', past:'Inné', pres:'Gach lá', fut:'Amárach', vn:'Ainm briathartha (…-ing)', va:'Aidiacht bhriathartha (…-ed)', label:'English', presMe:'Gach lá + mé', pastWe:'Inné + muid', presWe:'Gach lá + muid', futWe:'Amárach + muid'};
  return tw(`<table class="tb"><tr>${cols.map(c => `<th class="${cls[c] || ''}">${head[c]}</th>`).join('')}</tr>
    ${vs.map(v => `<tr>${cols.map(c => `<td class="${c === 'label' ? 'p' : 'f'} ${cls[c] || ''}">${v[c]}</td>`).join('')}</tr>`).join('')}</table>`);
}

/* =====================================================================
   GAMES & LEVELS
   ===================================================================== */
const prepLevel = (gas, prev = []) => () => {
  const ps = gas.map(P), out = [];
  const facts = shuffle(ps.flatMap(p => p.f.map((_, i) => [p, i])));
  const nMc = gas.length === 1 ? 8 : 9;
  facts.slice(0, nMc).forEach(([p, i], k) => out.push(ppQ(p, i, k < 3 ? 0 : rnd(3))));
  ps.forEach(p => out.push(ppNext(p)));
  take(prev, 2).forEach(g => { const p = P(g), q = ppQ(p, rnd(7)); q.tag = `🔁 Siar (<b>${p.ga}</b>) · ${q.tag}`; out.push(q); });
  out.push(ppMatch(take(facts, 5)));
  const easy = out.slice(0, 3), rest = shuffle(out.slice(3));
  return [...easy, ...rest, ...ps.map(ppBuild)];
};

/* =====================================================================
   ROUND ENGINE (multiple choice · build · match)
   ===================================================================== */
const PRAISE = ['Maith thú!','Ar fheabhas!','Go hiontach!','Togha!','Thar barr!','Sin é!','An-mhaith!'];
let R = null; // current round

function startRound(opts){ // {title, list, timed, back, onEnd}
  stopTimers();
  M = Progress.get('mastery', {});
  R = {...opts, q:opts.list.map(x => ({...x})), i:0, total:opts.list.length, good:0, missed:[], streak:0};
  view = 'play';
  askNext();
}
function topBar(){
  const pct = Math.round(100 * R.i / R.q.length);
  return `<div class="top"><button class="back" id="quit">✕</button><div class="prog"><div style="width:${pct}%"></div></div>
    <div class="chip">${R.streak >= 3 ? '🔥 ' + R.streak : '⭐ ' + R.good}</div></div>`;
}
function askNext(){
  stopTimers(); keyHandler = null;
  if(R.i >= R.q.length) return finishRound();
  const q = R.q[R.i];
  ({mc:askMC, build:askBuild, match:askMatch})[q.t](q);
  document.getElementById('quit').onclick = () => { stopTimers(); keyHandler = null; R.back(); };
  window.scrollTo(0, 0);
}
function record(q, ok){
  if(q.retry) return;
  if(ok){ R.good++; R.streak++; } else { R.streak = 0; R.missed.push(q); }
}
function feedback(ok, q, extra=''){
  const fb = document.getElementById('fb');
  fb.innerHTML = ok
    ? `<div class="fb good"><div class="ft">✅ ${pick(PRAISE)}</div>${q.note ? `<div class="fn">${q.note}</div>` : ''}</div>`
    : `<div class="fb bad"><div class="ft">❌ Ní hea…</div>${extra}${q.note ? `<div class="fn">${q.note}</div>` : ''}</div>`;
  fb.innerHTML += `<button class="big-btn next" id="nx">Ar aghaidh →</button>`;
  let gone = false;
  const go = () => { if(gone) return; gone = true; stopTimers(); R.i++; askNext(); };
  document.getElementById('nx').onclick = go;
  keyHandler = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  if(ok && R.timed) later(go, 2500); // only speed rounds move on by themselves
}

function askMC(q){
  const timed = R.timed && !q.retry;
  app.innerHTML = topBar() + `<div class="qc">${q.retry ? '🔁 Arís! · One more go at this one' : (q.tag || '')}</div>
    <div class="wcard" id="card"><div class="w ${q.small || q.prompt.length > 14 ? 'sm' : ''}">${q.prompt}</div>${q.sub ? `<div class="en">${q.sub}</div>` : ''}
    ${timed ? '<div class="timer" id="tm"></div>' : ''}</div>
    <div class="opts">${q.options.map((o, i) => `<button class="ob" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="keys">1 · 2 · 3 · 4</div><div id="fb"></div>`;
  let done = false;
  const btns = [...app.querySelectorAll('.ob')];
  function answer(idx){
    if(done) return; done = true; stopTimers();
    const ok = idx !== null && q.options[idx] === q.ans;
    btns.forEach((b, i) => { const o = q.options[i]; if(o === q.ans) b.classList.add('good'); else if(i === idx) b.classList.add('bad'); else b.classList.add('dim'); });
    const card = document.getElementById('card');
    card.classList.add(ok ? 'good' : 'bad', ok ? 'pop' : 'shake');
    const tm = document.getElementById('tm'); if(tm){ tm.style.transition = 'none'; tm.style.width = getComputedStyle(tm).width; }
    markFact(q.key, ok); record(q, ok);
    ok ? sfx.good() : sfx.bad();
    if(!ok && !q.retry) R.q.push({...q, retry:true, options:shuffle(q.options)});
    feedback(ok, q, `<div class="fp">${idx === null ? '⏰ Out of time! ' : ''}${q.ans}</div>`);
  }
  btns.forEach(b => b.onclick = () => answer(+b.dataset.i));
  keyHandler = e => { const n = +e.key; if(n >= 1 && n <= q.options.length) answer(n - 1); };
  if(timed){
    const tm = document.getElementById('tm');
    requestAnimationFrame(() => requestAnimationFrame(() => { tm.style.transition = 'width 12s linear'; tm.style.width = '0%'; }));
    later(() => answer(null), 12000);
  }
}

function askBuild(q){
  app.innerHTML = topBar() + `<div class="qc">${q.tag}</div>
    <div class="wcard" id="card"><div class="w sm">${q.prompt}</div><div class="en">Tap them in order, top to bottom</div></div>
    <div class="slots">${q.slots.map((s, i) => `<div class="slot ${i ? '' : 'cur'}" id="s${i}"><span class="lb">${s}</span><span class="fv"></span></div>`).join('')}</div>
    <div class="tiles">${shuffle(q.tiles.map((t, i) => ({t, i}))).map(x => `<button class="tile" data-t="${x.t}">${x.t}</button>`).join('')}</div><div id="fb"></div>`;
  let pos = 0, mistakes = 0, here = 0;
  const bad = new Set();
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if(pos >= q.tiles.length || b.classList.contains('used')) return;
    if(b.dataset.t === q.tiles[pos]){
      b.classList.add('used'); b.classList.remove('hintme');
      const s = document.getElementById('s' + pos); s.classList.remove('cur'); s.classList.add('done', 'pop'); s.querySelector('.fv').textContent = q.tiles[pos];
      markFact(q.keys[pos], !bad.has(pos)); sfx.tick();
      pos++; here = 0;
      app.querySelectorAll('.tile').forEach(t => t.classList.remove('hintme'));
      if(pos < q.tiles.length) document.getElementById('s' + pos).classList.add('cur');
      else { const ok = mistakes === 0; record(q, ok); ok ? sfx.good() : sfx.bad(); document.getElementById('card').classList.add(ok ? 'good' : 'bad');
        feedback(ok, q, `<div class="fn">${mistakes} slip${mistakes === 1 ? '' : 's'} — have another look:</div>`); }
    } else {
      mistakes++; here++; bad.add(pos); sfx.bad();
      b.classList.add('no', 'shake'); setTimeout(() => b.classList.remove('no', 'shake'), 450);
      if(here >= 2) app.querySelectorAll('.tile:not(.used)').forEach(t => { if(t.dataset.t === q.tiles[pos]) t.classList.add('hintme'); });
    }
  });
}

function askMatch(q){
  const L = shuffle(q.pairs.map((p, i) => ({x:p[0], i}))), Rr = shuffle(q.pairs.map((p, i) => ({x:p[1], i})));
  app.innerHTML = topBar() + `<div class="qc">${q.tag}</div>
    <div class="mgrid"><div class="mcol">${L.map(o => `<button class="mt" data-s="L" data-i="${o.i}">${o.x}</button>`).join('')}</div>
    <div class="mcol">${Rr.map(o => `<button class="mt" data-s="R" data-i="${o.i}">${o.x}</button>`).join('')}</div></div><div id="fb"></div>`;
  let sel = null, left = q.pairs.length, mistakes = 0;
  const wrong = new Set();
  app.querySelectorAll('.mt').forEach(b => b.onclick = () => {
    if(b.classList.contains('ok')) return;
    if(!sel || sel.dataset.s === b.dataset.s){ if(sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
    const a = sel; sel = null; a.classList.remove('sel');
    if(a.dataset.i === b.dataset.i){
      a.classList.add('ok', 'pop'); b.classList.add('ok', 'pop'); sfx.tick();
      const k = +a.dataset.i; markFact(q.pairs[k][2], !wrong.has(k));
      if(--left === 0){ const ok = mistakes <= 1; record(q, ok); ok ? sfx.good() : sfx.bad();
        q.note = q.pairs.map(p => `${p[0]} = <b>${p[1]}</b>`).join('<br>');
        feedback(ok, q, `<div class="fn">${mistakes} mismatches. Here they are:</div>`); }
    } else {
      mistakes++; wrong.add(+a.dataset.i); wrong.add(+b.dataset.i); sfx.bad();
      [a, b].forEach(x => { x.classList.add('no', 'shake'); setTimeout(() => x.classList.remove('no', 'shake'), 450); });
    }
  });
}

function finishRound(){
  stopTimers(); keyHandler = null;
  Progress.set('mastery', M);
  const pct = R.good / R.total, stars = pct >= .9 ? 3 : pct >= .75 ? 2 : pct >= .5 ? 1 : 0;
  R.onEnd && R.onEnd(stars);
  const msg = stars === 3 ? 'Ar fheabhas ar fad! · Brilliant!' : stars === 2 ? 'Go han-mhaith! · Really good!' : stars === 1 ? 'Maith thú! · Well done — go again for more stars!' : 'Ná géill! · Don’t give up — have another go!';
  const show = q => q.t === 'mc' ? `${q.prompt} → <b>${q.ans}</b>${q.sub ? `<small>${q.sub}</small>` : ''}` : q.t === 'build' ? `${q.prompt} → <b>${q.tiles.join(' · ')}</b>` : `Match: ${q.pairs.map(p => `${p[0]} = <b>${p[1]}</b>`).join(', ')}`;
  app.innerHTML = `<div class="res"><div class="big">${['🌱','🙂','😄','🤩'][stars]}</div><h2>${R.title}</h2>
    <div class="stars">${[0,1,2].map(i => `<span class="${i < stars ? 'on' : ''}">★</span>`).join('')}</div>
    <div class="score">${R.good} / ${R.total} right first time</div><p class="msg">${msg}</p>
    ${R.missed.length ? `<div class="review"><h3>📝 Le cleachtadh · To practise</h3><ul>${R.missed.map(q => `<li>${show(q)}</li>`).join('')}</ul></div>` : ''}
    <div class="btns">${R.extraBtn || ''}<button class="big-btn alt" id="again">↻ Arís</button><button class="big-btn alt" id="bk">← Siar</button></div></div>`;
  if(stars >= 2){ sfx.win(); confetti(); }
  document.getElementById('again').onclick = R.again;
  document.getElementById('bk').onclick = R.back;
  const nx = document.getElementById('nextlvl'); if(nx) nx.onclick = R.next;
}

/* =====================================================================
   SCREENS
   ===================================================================== */
const gp = g => Progress.get(g.id, {stars:[]});
function gameStars(g){ const s = gp(g).stars; return {got:s.reduce((a, b) => a + (b || 0), 0), max:g.levels.length * 3}; }
function mastered(){ const m = Progress.get('mastery', {}); const v = Object.values(m); return {seen:v.length, got:v.filter(e => e.b >= 3).length}; }

function renderMap(g){
  keyHandler = null; view = 'map';
  const st = gp(g).stars;
  app.innerHTML = `<div class="top"><a class="back" href="#">← Cluichí</a><div class="t">${g.emoji} ${g.title}</div><div class="chip">⭐ ${gameStars(g).got}/${gameStars(g).max}</div></div>
    ${g.about ? `<div class="tip">💡 ${g.about}</div>` : ''}
    <div class="levels">${g.levels.map((l, i) => { const open = i === 0 || (st[i - 1] || 0) >= 1, s = st[i] || 0;
      return `<button class="lvl ${open ? '' : 'locked'} ${l.boss ? 'boss' : ''}" data-i="${i}"><span class="n">${i + 1}</span><div class="e">${open ? l.e : '🔒'}</div>
        <div class="nm">${l.nm}</div><div class="sb">${l.sb}</div><div class="st">${[0,1,2].map(k => `<span class="${k < s ? 'on' : ''}">★</span>`).join('')}</div></button>`; }).join('')}</div>
    <p class="hint">Get at least ⭐ 1 star to open the next level. Mistakes come back at the end of each round.</p>
    <div class="foot"><span>${syncLabel()}</span>${st.some(x => x) ? '<button class="link" id="rst">↺ Reset this game</button>' : ''}</div>`;
  app.querySelectorAll('.lvl').forEach(b => b.onclick = () => { if(!b.classList.contains('locked')) renderIntro(g, +b.dataset.i); });
  const r = document.getElementById('rst');
  if(r) r.onclick = () => confirmBox(`Reset ${g.title}?`, 'All stars in this game will be cleared and only Level 1 will be open.', 'Reset game', () => { Progress.resetGame(g.id); renderMap(g); });
}
function renderIntro(g, i){
  keyHandler = null; view = 'intro'; stopTimers();
  const l = g.levels[i];
  app.innerHTML = `<div class="top"><button class="back" id="bk">← Leibhéil</button><div class="t">Leibhéal ${i + 1}</div><div class="chip">${l.e}</div></div>
    <div class="intro"><h2>${l.nm}</h2><p class="lead">${l.sb} · Foghlaim é! Learn it, then play.</p>
    ${l.learn()}<div class="tip">💡 ${l.tip}</div><button class="big-btn" id="go">Imir! ▶</button></div>`;
  document.getElementById('bk').onclick = () => renderMap(g);
  document.getElementById('go').onclick = () => play(g, i);
  keyHandler = e => { if(e.key === 'Enter') play(g, i); };
  window.scrollTo(0, 0);
}
function play(g, i){
  const l = g.levels[i], hasNext = i + 1 < g.levels.length;
  SCOPE = l.scope || null; const list = l.build(); SCOPE = null;
  startRound({ title:`${l.e} ${l.nm}`, list, timed:!!l.timed,
    back:() => renderMap(g), again:() => play(g, i), next:() => renderIntro(g, i + 1),
    onEnd:stars => {
      const d = gp(g); d.stars[i] = Math.max(d.stars[i] || 0, stars);
      for(let k = 0; k < g.levels.length; k++) if(d.stars[k] == null) d.stars[k] = 0;
      Progress.set(g.id, d);
      if(stars >= 1 && hasNext) R.extraBtn = '<button class="big-btn" id="nextlvl">Ar aghaidh ▶</button>';
    }});
}

/* ---------- review (spaced repetition) ---------- */
function startReview(){
  const m = Progress.get('mastery', {});
  const keys = Object.keys(m).filter(k => FACTS[k]);
  if(keys.length < 8){
    app.innerHTML = `<div class="top"><a class="back" href="#">← Cluichí</a><div class="t">🧠 Athchleachtadh</div><div class="chip">🧠</div></div>
      <div class="intro"><div class="big">🌱</div><h2>Play a few levels first!</h2><p class="lead">This game brings back the things you find hardest. It needs some facts to work with — play any game, then come back.</p>
      <a class="big-btn" href="#">← Cluichí</a></div>`;
    return;
  }
  // weakest + oldest first, a little shuffle so it isn't the same every time
  const ranked = keys.sort((a, b) => (m[a].b - m[b].b) || (m[a].t - m[b].t));
  const pickKeys = take(ranked.slice(0, 20), 12);
  startRound({ title:'🧠 Athchleachtadh', list:pickKeys.map(k => FACTS[k]()), timed:false,
    back:() => { location.hash = ''; renderHub(); }, again:startReview, onEnd:() => {} });
}

/* ---------- the glance card ---------- */
function renderCard(){
  keyHandler = null; view = 'card';
  app.innerHTML = `<div class="top"><a class="back" href="#">← Cluichí</a><div class="t">🃏 An Cárta</div><div class="chip">📚</div></div>
    <div class="sec">Forainmneacha <small>pronouns · my, your…</small></div>
    ${rowsTable(['', '', '', ''], PRON.map((p, i) => [p[0], p[1], POSS[i][0], POSS[i][1]]))}
    <div class="sec">Réamhfhocail <small>prepositional pronouns</small></div>
    ${prepTable(['ar','ag','do','le','ó','de','as'])}${prepTable(['faoi','chuig','roimh','i','thar','idir'])}
    <div class="sec">Briathra <small>verbs</small></div>
    ${verbTable(VERBS, ['label','cmd','past','pres','fut','vn','va'])}
    ${rowsTable(['', 'mé', 'sinn / muid', 'Not', 'Question'], [[pill('cmd'), '', '', 'Ná', ''], [pill('past'), '', '-(a)íomar', 'Níor', 'Ar…?'], [pill('pres'), '-(a)ím', '-(a)ímid', 'Ní', 'An…?'], [pill('fut'), '', '-óimid / -eoimid', 'Ní', 'An…?'], [pill('vn'), 'ag …', '', '', '']])}
    <div class="sec">Ceisteanna <small>question words</small></div>
    ${rowsTable(null, QW.map(q => [q[1], q[0]]))}
    <div class="sec">Bí <small>to be</small></div>
    ${rowsTable(['', 'Question', 'Yes', 'No', 'Where…?'], BI.map(b => [biPill(b), b.q, b.y, b.n, b.wh]))}
    ${rowsTable(['Question', 'English', 'Yes', 'No'], LIKE.map(l => [l.q, l.en, l.y, l.n]))}`;
  window.scrollTo(0, 0);
}

/* ---------- hub ---------- */
function syncLabel(){
  const s = Progress.status();
  return s === 'cloud' ? '☁️ Progress saved to your account' : s === 'loading' ? '⏳ Loading progress…' : '📱 Progress saved on this device';
}
function renderHub(){
  keyHandler = null; view = 'hub';
  const ms = mastered();
  const any = GAMES.some(g => gameStars(g).got > 0) || ms.seen > 0;
  app.innerHTML = `<header class="hub-head"><div class="flag">🇮🇪</div>
      <h1>Mo Chluichí <span class="g">Gae</span><span class="w">il</span><span class="o">ge</span></h1>
      <p>Roghnaigh cluiche! · Pick a game</p></header>
    <div class="grid">
      ${GAMES.map((g, n) => { const p = gameStars(g); return `
        <a class="card" href="#${g.id}" style="--bg:${g.bg}"><div class="ce">${g.emoji}</div><h2>${n + 1}. ${g.title}</h2><p>${g.blurb}</p>
          <div class="cp">⭐ ${p.got} / ${p.max}</div></a>`; }).join('')}
      <a class="card" href="#athchleachtadh" style="--bg:linear-gradient(135deg,#2B2B3A,#5A4A8A)"><div class="ce">🧠</div><h2>Athchleachtadh</h2>
        <p>Daily review: brings back the things you find hardest until they stick.</p>
        <div class="cp" style="align-self:stretch">🧠 ${ms.got} / ${FACT_TOTAL} learnt<div class="mbar"><div style="width:${100 * ms.got / FACT_TOTAL}%"></div></div></div></a>
      <a class="card" href="#carta" style="--bg:linear-gradient(135deg,#7A7A8C,#2B2B3A)"><div class="ce">🃏</div><h2>An Cárta</h2>
        <p>The whole glance card in one place, to look over before you play.</p><div class="cp">📚 Staidéar</div></a>
    </div>
    <div class="foot"><span>${syncLabel()}</span>${any ? '<button class="link" id="rstall">↺ Reset all progress</button>' : ''}</div>`;
  const r = document.getElementById('rstall');
  if(r) r.onclick = () => confirmBox('Reset everything?', 'This clears the stars, levels and learnt facts in every game. It can’t be undone.', 'Reset all', () => { Progress.resetAll(); renderHub(); });
}

function route(){
  stopTimers();
  const h = location.hash.slice(1), g = GAMES.find(x => x.id === h);
  if(g) renderMap(g); else if(h === 'athchleachtadh') startReview(); else if(h === 'carta') renderCard(); else renderHub();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
Progress.onChange(() => { if(view === 'hub') renderHub(); else if(view === 'map'){ const g = GAMES.find(x => x.id === location.hash.slice(1)); if(g) renderMap(g); } });
route();
Progress.connect();
</script>
